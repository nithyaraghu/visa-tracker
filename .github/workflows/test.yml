name: VisaGuard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Frontend lint + build ─────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3001

  # ── Job 2: Backend smoke test ─────────────────────────────────────
  backend:
    name: Backend Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Check backend starts
        run: |
          cd backend
          timeout 10 node server.js &
          sleep 5
          curl -f http://localhost:3001/api/health || exit 1
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: re_placeholder
          PORT: 3001

  # ── Job 3: Python agents unit tests ──────────────────────────────
  agents:
    name: Agent Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt

      - name: Install agent dependencies
        run: |
          cd agents
          pip install -r requirements.txt

      - name: Run pytest unit tests
        run: |
          cd agents
          pytest eval/run_eval.py::test_opt_unemployment_limit \
                 eval/run_eval.py::test_stem_cumulative_limit \
                 eval/run_eval.py::test_h1b_grace_period \
                 eval/run_eval.py::test_stem_e_verify_requirement \
                 eval/run_eval.py::test_response_not_empty \
                 -v
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}